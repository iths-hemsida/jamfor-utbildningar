<meta charset="utf-8">
<title>Kursplansutforskare</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Färger och typsnitt enligt IT-Högskolans grafiska profil v2.0, samma som jämförelsen (../index.html):
   Kod #662247, Moln #F9F9F9, Terminal #2D1A2E, Server #9C4F77, Pixel #FFB547. */
:root {
  --kod: #662247; --moln: #F9F9F9; --terminal: #2D1A2E; --server: #9C4F77; --pixel: #FFB547;
  --bg: var(--moln); --surface: #ffffff; --ink: var(--terminal); --muted: #6e5d6f; --line: #e7dfe5;
  --accent: var(--kod); --accent-soft: #f4e9ef; --detail: var(--server);
  --seg-a: var(--kod); --seg-b: var(--server); --seg-ink: #ffffff;
  --seg-lia: var(--pixel); --seg-lia-ink: var(--terminal);
  --seg-exam: var(--terminal); --seg-exam-ink: #ffffff;
  --track: #ece3e9;
  --ai-bg: #ffffff; --ai-ink: var(--kod); --ai-line: var(--kod);
  --font: Avenir, "Avenir Next", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--terminal); --surface: #3a2540; --ink: var(--moln); --muted: #c7b6c5; --line: #533a57;
    --accent: #f0b3d2; --accent-soft: #4d2a45; --detail: #e597bd; --seg-a: #8a3562; --seg-b: #b0628b;
    --seg-exam: #f0b3d2; --seg-exam-ink: var(--terminal); --track: #533a57; color-scheme: dark; --ai-bg: var(--moln); --ai-ink: var(--kod); --ai-line: transparent;
  }
}
:root[data-theme="dark"] {
  --bg: var(--terminal); --surface: #3a2540; --ink: var(--moln); --muted: #c7b6c5; --line: #533a57;
  --accent: #f0b3d2; --accent-soft: #4d2a45; --detail: #e597bd; --seg-a: #8a3562; --seg-b: #b0628b;
  --seg-exam: #f0b3d2; --seg-exam-ink: var(--terminal); --track: #533a57; color-scheme: dark; --ai-bg: var(--moln); --ai-ink: var(--kod); --ai-line: transparent;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding: clamp(40px, 7vw, 72px) max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px));
}
html.embedded body { padding-top: 8px; padding-bottom: 24px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 24px; }
h1, h2, h3 { font-family: var(--font); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { color: var(--accent); font-size: clamp(26px, 4vw, 36px); }
h2 { font-size: 20px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
header .eyebrow { margin-bottom: 10px; }
.lead { color: var(--muted); max-width: 64ch; margin: 6px 0 0; }
.proto { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--pixel); color: var(--terminal); font-size: 12px; font-weight: 700; vertical-align: middle; letter-spacing: 0; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Programväljare: knappar på dator, rullgardin i mobilen. */
.programs { display: flex; flex-wrap: wrap; gap: 8px; }
.prog { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; }
.prog:hover { border-color: var(--accent); }
.prog[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.progselect { display: none; width: 100%; font: inherit; font-weight: 700; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 18px; }
.prog-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.prog-head h2 { color: var(--accent); font-size: 24px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.prog-head a { color: var(--accent); font-weight: 700; font-size: 14px; }

/* Tidslinjen: ett spår per läsår, där bredden motsvarar antal veckor. */
.years { display: grid; gap: 14px; }
.year { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.year-label { font-weight: 800; font-size: 14px; padding-top: 12px; }
.year-label span { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.track { position: relative; display: flex; gap: 2px; height: 48px; }
.seg { flex: none; position: relative; border: 0; border-radius: 6px; padding: 0 8px; min-width: 6px; height: 100%; background: var(--seg-a); color: var(--seg-ink);
  font-size: 12px; font-weight: 700; text-align: left; line-height: 1.15; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; transition: transform .12s, box-shadow .12s; }
.seg.alt { background: var(--seg-b); }
.seg.lia { background: var(--seg-lia); color: var(--seg-lia-ink); }
.seg.exam { background: var(--seg-exam); color: var(--seg-exam-ink); }
.seg:hover { transform: translateY(-2px); }
.seg[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); z-index: 1; }
.seg.cont { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.seg.cut { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.rest { flex: 1; border-radius: 6px; border: 1px dashed var(--line); }
.ticks { grid-column: 2; position: relative; height: 18px; font-size: 11px; color: var(--muted); }
.ticks span { position: absolute; top: 0; padding-left: 4px; border-left: 1px solid var(--line); white-space: nowrap; }
.seg.ai { padding-right: 30px; }
.seg.ai.aidot { padding-right: 8px; }
.seg.ai.aidot::after { top: 4px; right: 50%; transform: translateX(50%); width: 6px; height: 6px; font-size: 0; border-radius: 50%; }
.seg.ai::after { content: "AI"; position: absolute; top: 4px; right: 4px; display: flex; align-items: center; justify-content: center; width: 20px; height: 16px; font-size: 10px; font-weight: 800; line-height: 1; letter-spacing: .02em; border-radius: 4px; background: var(--ai-bg); color: var(--ai-ink); }
.aitag { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 16px; font-size: 10px; font-weight: 800; line-height: 1; letter-spacing: .02em; border-radius: 4px; vertical-align: middle; background: var(--ai-bg); color: var(--ai-ink); box-shadow: inset 0 0 0 1px var(--ai-line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Detaljrutan för det valda momentet. */
.detail { border-radius: 10px; background: var(--accent-soft); padding: 18px 20px; display: grid; gap: 8px; }
.detail.inlist { margin: 6px 0 8px; }
.detail h3 { color: var(--accent); font-size: 22px; }
.detail p { margin: 0; max-width: 70ch; }
.detail h4 { margin: 4px 0 0; font-size: 14px; }
.detail ul { margin: 0; padding-left: 20px; list-style: disc; display: grid; gap: 2px; }
.detail .when { font-size: 14px; font-weight: 700; color: var(--detail); }
.detail .aibox { border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; padding: 10px 14px; display: grid; gap: 4px; }
.detail .aibox h4 { margin: 0; }
.progai { border-radius: 10px; border: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 4px; }
.progai h3 { font-size: 15px; margin: 0; display: flex; gap: 8px; align-items: center; }
.progai p { margin: 0; max-width: 80ch; }
.progai .src { color: var(--muted); font-size: 13px; }
.detail .src { color: var(--muted); font-size: 13px; }
.detail .nav { display: flex; gap: 8px; margin-top: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

/* Listan med alla moment i ordning. */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps > li > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; }
.steps > li:first-child > h3 { margin-top: 0; }
.step { width: 100%; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 10px; }
.step:hover { border-color: var(--line); }
.step[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.step i { width: 14px; height: 14px; border-radius: 4px; background: var(--seg-a); }
.step i.alt { background: var(--seg-b); } .step i.lia { background: var(--seg-lia); } .step i.exam { background: var(--seg-exam); }
.step b { font-weight: 700; }
.step b .aitag { margin-left: 8px; }
.step .w { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.note a { color: var(--muted); }

@media (max-width: 640px) {
  body { font-size: 14px; }
  .programs { display: none; }
  .progselect { display: block; }
  .card { padding: 14px; gap: 14px; }
  .prog-head h2 { font-size: 20px; }
  .year { grid-template-columns: minmax(0, 1fr); }
  .year-label { padding-top: 0; }
  .year-label span { display: inline; margin-left: 6px; }
  .ticks { grid-column: 1; }
  .track { height: 36px; gap: 1px; }
  .seg { padding: 0; font-size: 0; border-radius: 4px; }
  .seg.ai { padding-right: 0; }
  .seg.ai::after { top: 3px; right: 50%; transform: translateX(50%); width: 6px; height: 6px; font-size: 0; border-radius: 50%; }
  .detail { padding: 14px; }
  .detail h3 { font-size: 19px; }
  .step { grid-template-columns: 12px minmax(0, 1fr); gap: 2px 10px; padding: 8px; }
  .step i { width: 12px; height: 12px; grid-row: 1 / span 2; align-self: start; margin-top: 4px; }
  .step .w { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">IT-Högskolan · utbildningar</div>
    <h1>Utforska kursplanen <span class="proto">Prototyp</span></h1>
    <p class="lead">Välj en utbildning och se kurserna, LIA och examensarbetet i den ordning de kommer. Klicka på ett block för att läsa mer om det.</p>

    <div class="programs" id="programs"></div>
    <select class="progselect" id="progselect" aria-label="Välj utbildning"></select>
  </nav>

  <section class="card" id="card" aria-live="polite"></section>

  <p class="note" id="note"></p>
</div>

const EXTRA_INFO = {
  "Kompetensportfölj och hållbar utveckling": { appName: "Kompetensportfölj och hållbar utveckling", appPts: 10,
    desc: "Du lär dig vad arbetslivet kräver av yrkesrollen och hur du tar ansvar för ditt eget lärande under studierna, LIA och i jobbet. Du får också en introduktion till branschen, AI och hållbar utveckling.",
    moments: ["CV, LinkedIn och nätverkande", "LIA-processen", "Värdegrund och diskrimineringslagstiftning", "Strategier för studier och självledarskap", "AI i studierna och yrkesrollen", "Hållbarhet och Agenda 2030 i yrkesrollen"] },

    desc: "En bred introduktion till IT-landskapet, centrala roller och hur IT samspelar med verksamheten. Du lär dig grundläggande tekniska begrepp, IT-systemens livscykel och grunderna i informationssäkerhet.",
    moments: ["Grundläggande tekniska begrepp, till exempel server, klient, moln och nätverk", "Grunderna i ITIL: incident, problem och change", "IT Service Management och tjänsteleveranser i en IT-organisation"] },

    desc: "Du lär dig projektledarens ansvar för upphandling, budget och affärsmässig styrning av IT-projekt, och hur du följer upp tid, kostnad och nytta.",
    moments: ["Budget, resultat och effekt i IT-projekt", "Kostnadsbedömning, investering och drift, lönsamhet och risk", "Grundläggande avtalsrätt i IT-projekt", "Uppföljning och avvikelsehantering", "Digitala verktyg för budget och resursstyrning"] }
};
// Kompetensportföljen i IT-säkerhetstestare har en egen kursplan.
EXTRA_INFO["it-sakerhetstestare|Kompetensportfölj och hållbar utveckling"] = { ...EXTRA_INFO["Kompetensportfölj och hållbar utveckling"], src: "Källa: IT-Högskolans kursplan, fastställd 2026." };
const courseInfo = (pid, name) => COURSE_INFO[pid + "|" + name] || COURSE_INFO[INFO_ALIAS[pid + "|" + name]] || EXTRA_INFO[pid + "|" + name] || EXTRA_INFO[name];

// Var kurslistan kommer ifrån. Saknas src är det kursplanen på iths.se.
const PLAN_SRC = {
  app: { chip: "Enligt ansökan 2025", note: "Kurserna och poängen kommer från IT-Högskolans ansökan till Myndigheten för yrkeshögskolan 2025, som gäller utbildningar med start 2026. Där står kurserna i bokstavsordning, så ordningen bygger på iths.se och är ungefärlig" },
  kp: { chip: "Enligt kursplanerna 2026", note: "Kurserna och poängen kommer från kursplanerna som fastställdes 2026. Ordningen bygger på iths.se och är ungefärlig för nya kurser" }
};

const LIA_TEXT = "LIA betyder lärande i arbete. Under LIA är du på en arbetsplats i branschen och jobbar med riktiga uppgifter tillsammans med yrkesverksamma. Det är en del av utbildningen, så du har kvar ditt studiemedel.";
const EXAM_TEXT = "Examensarbetet avslutar utbildningen. Du gör ett eget arbete där du visar vad du har lärt dig under utbildningen.";

const MONTHS = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = s => new Date(s + "T12:00:00");
const addWeeks = (d, w) => new Date(d.getTime() + w * 7 * 864e5);
const monthYear = d => `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;

// Lägger ut varje moment på veckor och läsår. Ett moment som går över årsskiftet delas i två bitar.
function layout(p) {
  let week = 0, ci = 0;
  const items = p.plan.map(([name, pts, kind = "c"]) => {
    const w = pts / 5, it = { name, pts, kind, weeks: w, from: week, to: week + w, alt: kind === "c" && (ci++ % 2 === 1), ai: COURSE_AI[p.id + "|" + name] };
    week += w; return it;
  });
  const y1 = p.years[0], starts = [day(START), day(p.y2)];
  // Hela veckor i läsår 1 räknas från START, resten från starten av läsår 2.
  const dateAt = w => w < y1 ? addWeeks(starts[0], w) : addWeeks(starts[1], w - y1);
  items.forEach(it => {
    it.parts = [];
    if (it.from < y1) it.parts.push({ year: 0, from: it.from, to: Math.min(it.to, y1) });
    if (it.to > y1) it.parts.push({ year: 1, from: Math.max(it.from, y1) - y1, to: it.to - y1 });
    it.start = dateAt(it.from);
    it.end = addWeeks(dateAt(it.to - 1), 1);
  });
  return { items, total: week, scale: Math.max(...p.years, ...[y1, week - y1]) };
}

const params = new URLSearchParams(location.search);
let current = PROGRAMS.find(p => p.id === params.get("program")) || PROGRAMS[0];
let sel = 0, L = layout(current);

function renderPrograms() {
  document.getElementById("programs").innerHTML = PROGRAMS.map(p =>
    `<button class="prog" type="button" data-id="${p.id}" aria-pressed="${p === current}">${esc(p.name)}</button>`).join("");
  const s = document.getElementById("progselect");
  s.innerHTML = PROGRAMS.map(p => `<option value="${p.id}"${p === current ? " selected" : ""}>${esc(p.name)}</option>`).join("");
}

function weekLabel(it) {
  const a = Math.floor(it.from) + 1, b = Math.ceil(it.to);
  return a === b ? `vecka ${a}` : `vecka ${a}–${b}`;
}
function period(it) {
  const a = monthYear(it.start), b = monthYear(it.end);
  if (a === b) return a;
  return it.start.getFullYear() === it.end.getFullYear() ? `${MONTHS[it.start.getMonth()]}–${b}` : `${a}–${b}`;
}

function renderCard() {
  const p = current, { items, scale } = L;
  const yearNames = [`${day(START).getFullYear()}/${String(day(START).getFullYear() + 1).slice(2)}`, `${day(p.y2).getFullYear()}/${String(day(p.y2).getFullYear() + 1).slice(2)}`];
  const tracks = p.years.map((len, y) => {
    const segs = [];
    items.forEach((it, i) => it.parts.filter(pt => pt.year === y).forEach(pt => {
      const cls = [it.kind === "l" ? "lia" : it.kind === "e" ? "exam" : it.alt ? "alt" : "",
        it.parts.length > 1 && y === 1 ? "cont" : "", it.parts.length > 1 && y === 0 ? "cut" : "", it.ai ? "ai" : "", it.ai && pt.to - pt.from < 4 ? "aidot" : ""].join(" ");
      const wPct = (pt.to - pt.from) / scale * 100;
      segs.push(`<button class="seg ${cls}" type="button" data-i="${i}" aria-pressed="${i === sel}" style="width:calc(${wPct}% - 2px)"
        aria-label="${esc(it.name)}, ${it.pts} poäng, ${weekLabel(it)}${it.ai ? ", AI ingår" : ""}" title="${esc(it.name)} · ${it.pts} p${it.ai ? " · AI ingår" : ""}">${esc(it.name)}${it.parts.length > 1 && y === 1 ? " (forts.)" : ""}</button>`);
    }));
    const rest = (scale - len) / scale * 100;
    // Månadsmarkeringar: första måndagen i varje månad som ryms i läsåret.
    const s0 = y === 0 ? day(START) : day(p.y2), ticks = [];
    for (let m = 0; m < 12; m++) {
      const d = new Date(s0.getFullYear(), s0.getMonth() + m, 1, 12);
      const w = (d - s0) / (7 * 864e5);
      if (w < 0 || w > len - 1) continue;
      if (ticks.length && w - ticks[ticks.length - 1].w < 3.5) continue;
      ticks.push({ w, t: MONTHS[d.getMonth()] });
    }
    return `<div class="year">
      <div class="year-label">Läsår ${y + 1}<span>${yearNames[y]} · ${len} v</span></div>
      <div class="track">${segs.join("")}${rest > 0.5 ? `<div class="rest" style="flex-basis:${rest}%" title="Utbildningen är slut"></div>` : ""}</div>
      <div class="ticks" aria-hidden="true">${ticks.map(t => `<span style="left:${t.w / scale * 100}%">${t.t}</span>`).join("")}</div>
    </div>`;
  }).join("");

  const courseWeeks = items.filter(i => i.kind === "c").reduce((s, i) => s + i.weeks, 0);
  const liaWeeks = items.filter(i => i.kind === "l").reduce((s, i) => s + i.weeks, 0);
  const list = p.years.map((_, y) => {
    const rows = items.map((it, i) => ({ it, i })).filter(({ it }) => it.parts[0].year === y);
    if (!rows.length) return "";
    return `<li><h3>Läsår ${y + 1}</h3></li>` + rows.map(({ it, i }) => `<li><button class="step" type="button" data-i="${i}" aria-pressed="${i === sel}">
      <i class="${it.kind === "l" ? "lia" : it.kind === "e" ? "exam" : it.alt ? "alt" : ""}"></i><b>${esc(it.name)}${it.ai ? `<span class="aitag" title="AI ingår enligt kursplanen">AI</span>` : ""}</b><span class="w">${it.pts} p · ${weekLabel(it)}</span></button></li>`).join("");
  }).join("");

  document.getElementById("card").innerHTML = `
    <div class="prog-head">
      <div style="display:grid; gap:8px">
        <h2>${esc(p.name)}</h2>
        <div class="facts"><span class="fact">${p.yh} YH-poäng</span><span class="fact">${courseWeeks} veckor kurser</span><span class="fact">${liaWeeks} veckor LIA</span><span class="fact">${esc(p.place)}</span></div>
      </div>
      <a href="${p.url}" target="_blank" rel="noopener">Utbildningen på iths.se ↗</a>
    </div>
    ${aiBox(p)}
    <div class="years" role="group" aria-label="Tidslinje">${tracks}</div>
    <div class="legend" aria-hidden="true"><span><i style="background:var(--seg-a)"></i>Kurs</span><span><i style="background:var(--seg-lia)"></i>LIA, lärande i arbete</span><span><i style="background:var(--seg-exam)"></i>Examensarbete</span><span><span class="aitag">AI</span> AI ingår enligt kursplanen</span></div>
    <span id="detailslot" hidden></span><div class="detail" id="detail"></div>
    <div><h2 style="font-size:17px; margin-bottom:8px">Alla moment i ordning</h2><ul class="steps">${list}</ul></div>`;
  renderDetail();

  document.getElementById("note").innerHTML = `${p.src || p.guessed ? "Ordningen mellan kurserna är ungefärlig. " : ""}Veckorna är räknade på 5 YH-poäng per vecka, och månaderna är ungefärliga. Kurser kan gå delvis parallellt, och lov ingår inte. Start augusti ${day(START).getFullYear()}.`;
}

function aiBox(p) {
  const a = AI_INFO[p.id], n = L.items.filter(i => i.ai).length;
  if (!a && !n) return "";
  return `<div class="progai"><h3><span class="aitag">AI</span> AI i utbildningen</h3>
    ${a ? `<p>${esc(a[0])}</p>` : ""}
    ${n ? `<p class="src">AI nämns i ${n} av ${L.items.length} moment, markerade med AI nedan.</p>` : ""}</div>`;
}

function renderDetail() {
  const p = current, it = L.items[sel], info = courseInfo(p.id, it.name);
  let body;
  if (it.kind === "l") body = `<p>${esc(LIA_TEXT)}</p>`;
  else if (it.kind === "e") body = `<p>${esc(EXAM_TEXT)}</p>`;
  else if (info) body = `<p>${esc(info.desc)}</p>${info.moments && info.moments.length ? `<h4>Det här ingår bland annat</h4><ul>${info.moments.map(m => `<li>${esc(m)}</li>`).join("")}</ul>` : ""}`;
  else body = `<p>Det finns ingen beskrivning av kursen här ännu. Läs mer på utbildningssidan på iths.se.</p>`;
  const kind = it.kind === "l" ? "LIA" : it.kind === "e" ? "Examensarbete" : `Kurs ${L.items.slice(0, sel + 1).filter(i => i.kind === "c").length} av ${L.items.filter(i => i.kind === "c").length}`;
  const yearTxt = it.parts.length > 1 ? "läsår 1 och 2" : `läsår ${it.parts[0].year + 1}`;
  document.getElementById("detail").innerHTML = `
    <div class="eyebrow">${kind}</div>
    <h3>${esc(it.name)}</h3>
    <div class="when">${it.pts} YH-poäng · cirka ${it.weeks} veckor · ${weekLabel(it)}, ${yearTxt} · ungefär ${period(it)}</div>
    ${body}
    ${it.ai ? `<div class="aibox"><h4><span class="aitag">AI</span> AI i ${it.kind === "c" ? "kursen" : it.kind === "l" ? "LIA" : "examensarbetet"}</h4><p>${esc(it.ai[0])}</p></div>` : ""}
    <div class="nav"><button class="btn" type="button" data-step="-1"${sel === 0 ? " disabled" : ""}>← Föregående</button><button class="btn" type="button" data-step="1"${sel === L.items.length - 1 ? " disabled" : ""}>Nästa →</button></div>`;
}

function select(i, focus) {
  sel = Math.max(0, Math.min(L.items.length - 1, i));
  document.querySelectorAll(".seg, .step").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.i === sel)));
  renderDetail();
  if (focus) { const b = document.querySelector(`.detail [data-step="${focus}"]`); if (b && !b.disabled) b.focus(); }
}

// I mobilen ligger listan långt under tidslinjen, så där öppnas detaljrutan direkt under kursen man trycker på i listan.
const NARROW = matchMedia("(max-width: 640px)");
function placeDetail(li) {
  const d = document.getElementById("detail"), slot = document.getElementById("detailslot");
  if (li) { li.append(d); d.classList.add("inlist"); }
  else if (d.previousElementSibling !== slot) { slot.after(d); d.classList.remove("inlist"); }
}

function setProgram(id) {
  const p = PROGRAMS.find(x => x.id === id);
  if (!p || p === current) return;
  current = p; sel = 0; L = layout(p);
  params.set("program", id);
  try { history.replaceState(null, "", "?" + params.toString() + location.hash); } catch (_) {}
  renderPrograms(); renderCard();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.classList.contains("prog")) setProgram(b.dataset.id);
  else if (b.dataset.i !== undefined) { select(+b.dataset.i); placeDetail(b.classList.contains("step") && NARROW.matches ? b.closest("li") : null); }
  else if (b.dataset.step) {
    const inList = document.getElementById("detail").classList.contains("inlist");
    select(sel + +b.dataset.step, b.dataset.step);
    if (inList) { placeDetail(document.querySelector(`.step[data-i="${sel}"]`).closest("li")); const f = document.querySelector(`.detail [data-step="${b.dataset.step}"]`); if (f && !f.disabled) f.focus(); }
  }
});
document.getElementById("progselect").addEventListener("change", e => setProgram(e.target.value));
document.getElementById("card").addEventListener("keydown", e => {
  if (!e.target.classList.contains("seg")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    select(sel + (e.key === "ArrowRight" ? 1 : -1));
    const b = document.querySelector(`.seg[data-i="${sel}"]`); if (b) b.focus();
  }
});

renderPrograms(); renderCard();

// Inbäddad på iths.se: skicka höjden så att iframen växer med innehållet.
if (window.self !== window.top) {
  let last = 0;
  const sendHeight = () => {
    const h = Math.ceil(document.documentElement.scrollHeight);
    if (Math.abs(h - last) < 2) return;
    last = h;
    window.parent.postMessage({ type: "kursplan-height", h }, "*");
  };
  new ResizeObserver(sendHeight).observe(document.body);
  window.addEventListener("load", sendHeight);
}
</script>
