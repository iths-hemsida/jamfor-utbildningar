<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Javautvecklare i korthet | IT-Högskolan</title>
<style>html, body { margin: 0; background: #fff; } body { padding: 0 16px; } @media (max-width: 500px) { html.inbaddad body { padding: 0 2px; } }</style>
<script>if (window.parent !== window) document.documentElement.className = "inbaddad";</script>
</head>
<body>
<!-- IT-Högskolan: Faktatabell för Javautvecklare. Klistra in hela snutten i ett HTML-snippet i WPCode, eller bädda in https://iths-hemsida.github.io/jamfor-utbildningar/java-fakta/ som iframe. All CSS är avgränsad till #iths-java-fakta. Fakta från iths.se/utbildningar/javautvecklare/ (12 nov 2026). -->
<style>
/* Samma grafiska profil som "Vad är frontend?": Kod #662247, Moln #F9F9F9, Terminal #2D1A2E, Server #9C4F77, Pixel #FFB547. */
#iths-java-fakta {
  --kod: #662247; --moln: #F9F9F9; --terminal: #2D1A2E; --server: #9C4F77; --pixel: #FFB547;
  --surface: #ffffff; --ink: var(--terminal); --muted: #6e5d6f; --line: #e7dfe5; --soft: #f4e9ef;
  --font-display: "Avenir LT W01_85 Heavy1475544", Avenir, "Avenir Next", Helvetica, Arial, sans-serif;
  --font-body: "Avenir LT W01_45 Book1475508", Avenir, "Avenir Next", Helvetica, Arial, sans-serif;
  container-type: inline-size;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  max-width: 1040px; margin: 0 auto; padding-block: 24px 40px;
}
#iths-java-fakta *, #iths-java-fakta *::before, #iths-java-fakta *::after { box-sizing: border-box; }
#iths-java-fakta p { margin: 0; }
#iths-java-fakta a { color: var(--kod); font-family: var(--font-display); font-weight: 800; text-underline-offset: 3px; }
#iths-java-fakta a:hover { color: var(--terminal); }
#iths-java-fakta :focus-visible { outline: 3px solid var(--kod); outline-offset: 2px; }
#iths-java-fakta .wrap { display: grid; gap: 20px; }
#iths-java-fakta .intro { display: grid; gap: 8px; }
#iths-java-fakta .eyebrow { font-family: var(--font-display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 800; }
#iths-java-fakta h2 { font-family: var(--font-display); font-weight: 800; margin: 0; letter-spacing: -0.02em; line-height: 1.1; color: var(--kod); font-size: clamp(28px, 4.4vw, 40px); text-wrap: balance; }
#iths-java-fakta .intro p { color: var(--muted); max-width: 62ch; }

/* Ansökningsstatus */
#iths-java-fakta .status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; background: var(--kod); color: #fff; border-radius: 12px; padding: 14px 18px; }
#iths-java-fakta .status b { font-family: var(--font-display); font-weight: 800; color: var(--pixel); display: block; font-size: 17px; }
#iths-java-fakta .status span { font-size: 14px; color: rgba(255,255,255,.88); }
#iths-java-fakta .status a { flex: none; background: var(--pixel); color: var(--terminal); text-decoration: none; border-radius: 999px; padding: 9px 18px; font-size: 15px; }
#iths-java-fakta .status a:hover { background: #fff; color: var(--kod); }

/* Tabellen: två spalter på bred yta, en på smal */
#iths-java-fakta .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
#iths-java-fakta .col { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
#iths-java-fakta .rad { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; transition: border-color .2s ease, box-shadow .2s ease; }
#iths-java-fakta .rad:hover { border-color: var(--server); }
#iths-java-fakta .rad.open { border-color: var(--kod); box-shadow: 0 8px 24px rgba(45, 26, 46, .10); }
#iths-java-fakta .knapp { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
#iths-java-fakta .ikon { width: 40px; height: 40px; border-radius: 10px; background: var(--soft); color: var(--kod); display: grid; place-items: center; flex: none; }
#iths-java-fakta .rad.open .ikon { background: var(--kod); color: #fff; }
#iths-java-fakta .ikon svg { width: 22px; height: 22px; }
#iths-java-fakta .lbl { display: block; font-size: 13px; color: var(--muted); line-height: 1.3; }
#iths-java-fakta .val { display: block; font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1.25; }
#iths-java-fakta .plus { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); position: relative; flex: none; transition: transform .2s ease, border-color .2s ease; }
#iths-java-fakta .plus::before, #iths-java-fakta .plus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 2px; background: var(--kod); transform: translate(-50%, -50%); border-radius: 2px; }
#iths-java-fakta .plus::after { transform: translate(-50%, -50%) rotate(90deg); transition: opacity .2s ease; }
#iths-java-fakta .rad.open .plus { border-color: var(--kod); transform: rotate(180deg); }
#iths-java-fakta .rad.open .plus::after { opacity: 0; }
#iths-java-fakta .mer { padding: 0 16px 16px 66px; font-size: 15px; display: grid; gap: 8px; }
#iths-java-fakta .mer[hidden] { display: none; }
#iths-java-fakta .mer ul { margin: 0; padding-left: 18px; }
#iths-java-fakta .kalla { font-size: 13px; color: var(--muted); }

@container (max-width: 640px) {
  #iths-java-fakta .grid, #iths-java-fakta .col { grid-template-columns: minmax(0, 1fr); gap: 8px; }
}
@container (max-width: 400px) {
  #iths-java-fakta .knapp { gap: 10px; padding: 10px 12px; }
  #iths-java-fakta .ikon { width: 36px; height: 36px; }
  #iths-java-fakta .ikon svg { width: 20px; height: 20px; }
  #iths-java-fakta .val { font-size: 16px; }
  #iths-java-fakta .mer { padding: 0 14px 14px; }
  #iths-java-fakta .status { padding: 12px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  #iths-java-fakta * { transition: none !important; }
}
</style>

<section id="iths-java-fakta" aria-labelledby="java-fakta-rubrik">
  <div class="wrap">
    <div class="intro">
      <span class="eyebrow">Javautvecklare</span>
      <h2 id="java-fakta-rubrik">Utbildningen i korthet</h2>
      <p>Klicka på en rad för att läsa mer.</p>
    </div>

    <div class="status">
      <p><b>Ansökan öppnar i februari 2027</b><span>Startar 30 augusti 2027. Gör en intresseanmälan så får du en påminnelse.</span></p>
    </div>

    <div class="grid" id="java-fakta-lista"></div>
    <p class="kalla">Frågor om antagningen? Mejla <a href="mailto:antagning@iths.se">antagning@iths.se</a>.</p>
  </div>
</section>

<script>
(function () {
  var root = document.getElementById("iths-java-fakta");
  if (!root) return;
  var I = {
    start: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    ort: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    tid: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    lia: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
    kostnad: '<circle cx="12" cy="12" r="9"/><path d="M9 9.5c0-1.4 1.3-2.2 3-2.2s3 .8 3 2.2c0 3-6 1.8-6 5 0 1.3 1.3 2.2 3 2.2s3-.9 3-2.2M12 5.5v1.8M12 16.7v1.8"/>',
    csn: '<path d="M3 10l9-5 9 5-9 5-9-5z"/><path d="M7 12.2V16c0 1.4 2.2 3 5 3s5-1.6 5-3v-3.8"/>',
    prov: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    behorig: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    dator: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    jobb: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>'
  };
  var RADER = [
    { i: "start", lbl: "Start", val: "30 augusti 2027",
      mer: "<p>Utbildningen startar i augusti 2027. Ansökan öppnar i februari 2027.</p>" },
    { i: "ort", lbl: "Studieort", val: "Stockholm eller distans",
      mer: "<p>Du väljer själv om du vill plugga på plats i Stockholm eller på distans. Undervisningen sker på svenska.</p>" },
    { i: "tid", lbl: "Längd", val: "2 år · 400 YH-poäng",
      mer: "<p>Utbildningen är på heltid. 5 YH-poäng motsvarar en veckas studier, så 400 poäng blir 80 veckor fördelade på två läsår.</p>" },
    { i: "lia", lbl: "LIA-praktik", val: "24 veckor",
      mer: "<p>LIA betyder lärande i arbete. Du jobbar med riktiga uppgifter på ett företag, med en handledare där. Du söker platsen själv, med stöd från oss hela vägen.</p><p><a href=\"https://www.iths.se/lia-praktik/\" target=\"_top\">Läs mer om LIA</a></p>" },
    { i: "kostnad", lbl: "Kostnad", val: "Avgiftsfri",
      mer: "<p>Yrkeshögskolan är avgiftsfri, så det kostar inget att gå utbildningen.</p>" },
    { i: "csn", lbl: "CSN", val: "Ja, lån och bidrag",
      mer: "<p>Du kan få studiemedel från CSN under hela utbildningen, även under LIA. Du söker själv hos CSN.</p><p><a href=\"https://www.csn.se/\" target=\"_blank\" rel=\"noopener\">Gå till csn.se</a></p>" },
    { i: "behorig", lbl: "Behörighet", val: "Gymnasieexamen + 4 kurser",
      mer: "<p>Du behöver gymnasieexamen eller motsvarande, och dessutom:</p><ul><li>Engelska 6</li><li>Matematik 2</li><li>Svenska 2 eller Svenska som andraspråk 2</li><li>Programmering 1</li></ul><p>Saknar du något kan du bli behörig på andra sätt, till exempel genom arbetslivserfarenhet. <a href=\"https://www.iths.se/behorighet/\" target=\"_top\">Så blir du behörig</a></p>" },
    { i: "prov", lbl: "Antagningsprov", val: "Digitalt, på distans",
      mer: "<p>Alla sökande gör vårt digitala antagningsprov. Du gör det hemifrån, på din egen dator.</p>" },
    { i: "dator", lbl: "Dator", val: "Windows 11 · 16 GB RAM",
      mer: "<p>Du behöver en egen dator:</p><ul><li>PC från 2020 eller senare med Windows 11</li><li>16 GB RAM och minst 512 GB SSD</li><li>Intel Core i5 eller motsvarande, eller nyare</li></ul><p>Mac rekommenderas inte, eftersom programmen i utbildningen är anpassade för Windows.</p>" },
    { i: "jobb", lbl: "Efter examen", val: "Javautvecklare m.fl.",
      mer: "<p>Exempel på yrkesroller:</p><ul><li>Javautvecklare</li><li>Systemutvecklare</li><li>Mjukvaruutvecklare</li></ul>" }
  ];

  var lista = document.getElementById("java-fakta-lista");
  // Två fristående spalter, så att en öppnad rad bara skjuter ner raderna under sig i samma spalt.
  var halv = Math.ceil(RADER.length / 2);
  function rad(r, n) {
    return '<li class="rad"><button type="button" class="knapp" aria-expanded="false" aria-controls="jf-mer-' + n + '">' +
      '<span class="ikon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + I[r.i] + "</svg></span>" +
      '<span><span class="lbl">' + r.lbl + '</span><span class="val">' + r.val + "</span></span>" +
      '<span class="plus" aria-hidden="true"></span></button>' +
      '<div class="mer" id="jf-mer-' + n + '" hidden>' + r.mer + "</div></li>";
  }
  lista.innerHTML = '<ul class="col">' + RADER.slice(0, halv).map(function (r, n) { return rad(r, n); }).join("") + "</ul>" +
    '<ul class="col">' + RADER.slice(halv).map(function (r, n) { return rad(r, n + halv); }).join("") + "</ul>";

  lista.addEventListener("click", function (e) {
    var b = e.target.closest(".knapp");
    if (!b) return;
    var oppen = b.getAttribute("aria-expanded") === "true";
    b.setAttribute("aria-expanded", String(!oppen));
    b.parentNode.classList.toggle("open", !oppen);
    document.getElementById(b.getAttribute("aria-controls")).hidden = oppen;
    send();
  });

  // Höjd till förälder när tabellen visas i en iframe. Mät sektionen, inte dokumentet, så att iframen även kan krympa.
  function send() {
    if (window.parent === window) return;
    window.parent.postMessage({ type: "java-fakta-height", h: Math.ceil(root.getBoundingClientRect().bottom + window.scrollY) }, "*");
  }
  if (window.parent !== window && "ResizeObserver" in window) new ResizeObserver(send).observe(document.body);
  send();
})();
</script>

</body>
</html>
